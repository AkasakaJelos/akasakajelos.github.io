name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main_2
  # Build-only runs: check a branch in CI before it reaches main_2.
  pull_request:
    branches:
      - main_2
  workflow_dispatch:

# The build job runs third-party install scripts, so it gets read-only
# access; only the deploy job can write to Pages or mint an OIDC token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave the job's GITHUB_TOKEN in .git/config while third-party
          # dependency install/build scripts run in the same job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # No `version:` — the action reads packageManager (pnpm 11) from package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The build injects one site-wide CSP. A theme change that adds an
      # unhashed inline script or handler, a /posts/ link or a published draft
      # fails the deploy instead of shipping.
      - name: Verify build output
        run: |
          pnpm run test:dist
          pnpm run verify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main_2'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
